[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arbiter"
version = "0.2.0"
description = "Arbiter — Autonomous AI-powered trading bot with multi-role agents"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "tabulate>=0.9",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "ccxt>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-telegram-bot>=21.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
aitb = "src.main:cli"
aitb-web = "src.main:run_web"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
