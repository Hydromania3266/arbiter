name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev pkg-config libgtk-3-dev

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd src-tauri
          cargo tauri build

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: arbiter-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: arbiter-deb
          path: src-tauri/target/release/bundle/deb/*.deb

  publish-release:
    runs-on: ubuntu-latest
    needs: build-linux
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: arbiter-appimage

      - name: Download deb
        uses: actions/download-artifact@v4
        with:
          name: arbiter-deb

      - name: Generate latest.json for updater
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cat > latest.json << EOF
          {
            "version": "${VERSION#v}",
            "notes": $(gh api "${GITHUB_REF}" --jq '.body' | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read() or "Release $' + '${VERSION#v}' + '")'),
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "$(cat signature.sig | base64 -w0)",
                "url": "https://github.com/${{ github.repository }}/releases/download/${VERSION}/Arbiter_${VERSION#v}_amd64.AppImage"
              }
            }
          }
          EOF
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Sign AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd src-tauri
          cargo tauri signer sign ../target/release/bundle/appimage/*.AppImage

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.AppImage
            *.deb
            latest.json
          generate_release_notes: true
