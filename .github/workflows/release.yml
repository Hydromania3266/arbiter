name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev pkg-config libgtk-3-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd src-tauri
          cargo tauri build

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: arbiter-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload AppImage signature
        uses: actions/upload-artifact@v4
        with:
          name: arbiter-appimage-sig
          path: src-tauri/target/release/bundle/appimage/*.AppImage.sig

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: arbiter-deb
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: Upload deb signature
        uses: actions/upload-artifact@v4
        with:
          name: arbiter-deb-sig
          path: src-tauri/target/release/bundle/deb/*.deb.sig

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: arbiter-appimage

      - name: Download AppImage signature
        uses: actions/download-artifact@v4
        with:
          name: arbiter-appimage-sig

      - name: Download deb
        uses: actions/download-artifact@v4
        with:
          name: arbiter-deb

      - name: Download deb signature
        uses: actions/download-artifact@v4
        with:
          name: arbiter-deb-sig

      - name: Generate latest.json
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_NUM=${VERSION#v}
          SIG=$(cat *.AppImage.sig | base64 -w0)
          cat > latest.json << EOF
          {
            "version": "${VERSION_NUM}",
            "notes": "Release ${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "${SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/${VERSION}/Arbiter_${VERSION_NUM}_amd64.AppImage"
              }
            }
          }
          EOF
          echo "Generated latest.json:"
          cat latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.AppImage
            *.AppImage.sig
            *.deb
            *.deb.sig
            latest.json
          generate_release_notes: true