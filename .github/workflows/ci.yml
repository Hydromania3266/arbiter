name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: |
          pytest tests/ -v

  build-desktop:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev pkg-config libgtk-3-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd src-tauri
          cargo tauri build

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: arbiter-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload AppImage signature
        uses: actions/upload-artifact@v4
        with:
          name: arbiter-appimage-sig
          path: src-tauri/target/release/bundle/appimage/*.AppImage.sig

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: arbiter-deb
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: Upload deb signature
        uses: actions/upload-artifact@v4
        with:
          name: arbiter-deb-sig
          path: src-tauri/target/release/bundle/deb/*.deb.sig